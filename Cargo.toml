[package]
name = "gungnir"
version = "0.2.0"
edition = "2021"
description = "Local-first, markdown-native memory for AI agents"
license = "MIT"
repository = "https://github.com/definitelynotguru/gungnir"
keywords = ["agent", "memory", "mcp", "llm", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Local embedding model (bge-small-en-v1.5 via fastembed/ONNX) for
# `--semantic` recall and briefings. Default build stays zero-network:
# the model downloads on first semantic use only, into `<root>/.cache`.
embed = ["dep:fastembed"]
# Test-only: lets `GUNGNIR_TEST_EMBEDDER=1` swap the shipped model for the
# uniform-vector `embedding::Uniform`, so semantic dispatch runs offline.
# Never enable for a release binary — it makes --semantic fabricate
# matches. CI's embed test leg enables it; release builds ship `embed`
# alone, where the env var is compiled out.
test-embedder = ["embed"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde_json = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
walkdir = "2"
fastembed = { version = "7.5", optional = true, default-features = false, features = [
    "hf-hub-native-tls",
    "ort-download-binaries-native-tls",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gungnir"
path = "src/main.rs"

[lib]
name = "gungnir"
path = "src/lib.rs"
